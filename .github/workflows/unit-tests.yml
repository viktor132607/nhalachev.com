name: Unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run 100% coverage suite
        run: npm run test:coverage

      - name: Report uncovered functions
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("fs")
          const path = "coverage/coverage-final.json"
          if (!fs.existsSync(path)) process.exit(0)
          const coverage = JSON.parse(fs.readFileSync(path, "utf8"))
          for (const [file, data] of Object.entries(coverage)) {
            for (const [id, count] of Object.entries(data.f)) {
              if (count === 0) {
                const meta = data.fnMap[id]
                console.log("UNCOVERED_FUNCTION", file, meta.name, meta.loc.start.line + ":" + meta.loc.start.column)
              }
            }
          }
          NODE

      - name: Keep package lock in sync
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package lock for unit tests"
            git push
          fi
